name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ad-hoc signing: CI has no certificates, and the project's team ID is upstream's.
  SIGNING: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

jobs:
  test:
    name: Test and build
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Run tests
        run: |
          xcodebuild test \
            -workspace StayLit.xcworkspace \
            -scheme StayLit \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            $SIGNING

      - name: Build the release app
        run: |
          xcodebuild build \
            -workspace StayLit.xcworkspace \
            -scheme "StayLit (Direct)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            $SIGNING
          lipo -archs "build/Build/Products/Release/StayLit.app/Contents/MacOS/StayLit"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
